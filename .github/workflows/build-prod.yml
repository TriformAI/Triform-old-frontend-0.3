name: Build prod

on:
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Only run on push with PROD: prefix or workflow_dispatch
    if: ${{(startsWith(github.event.head_commit.message, 'PROD:')) || (github.event_name == 'workflow_dispatch')}}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Authenticate with Scaleway
      id: auth
      uses: docker/login-action@v3
      with:
        username: nologin
        password: ${{ secrets.SCW_API_KEY }}
        registry: rg.fr-par.scw.cloud/tf-prod

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set outputs
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: rg.fr-par.scw.cloud/tf-prod/nexus-frontend:latest,rg.fr-par.scw.cloud/tf-prod/nexus-frontend:${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max