name: Deploy

on:
  push:
    tags:
    - 'v*.*.*'

env:
  REGISTRY: europe-docker.pkg.dev
  GKE_CLUSTER: staging
  GKE_REGION: europe-west3
  VITE_TOLGEE_API_URL: https://app.tolgee.io
  VITE_TRICORE_URL: https://api.tricore.dev/v1
  VITE_TRICORE_AUTH_URL: https://api.tricore.dev/v1
  PUBLIC_TRICORE_AUTH_URL: https://api.tricore.dev/v1
  NODE_ENV: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Authenticate with Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        token_format: 'access_token'

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Set-up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Nothing too secret here! Visible in `docker history`
    - name: Build and push Docker image
      run: |
        echo "PUBLIC_API_URL=" > .env
        echo "GITHUB_CLIENT_ID=" >> .env
        echo "GITHUB_CLIENT_SECRET=" >> .env
        echo "AUTH_SECRET=" >> .env

        echo "VITE_TOLGEE_API_URL=${{ env.VITE_TOLGEE_API_URL }}" >> .env
        echo "VITE_TOLGEE_API_KEY=${{ secrets.VITE_TOLGEE_API_KEY }}" >> .env
        echo "VITE_TRICORE_URL=${{ env.VITE_TRICORE_URL }}" >> .env
        echo "VITE_TRICORE_AUTH_URL=${{ env.VITE_TRICORE_AUTH_URL }}" >> .env
        echo "PUBLIC_TRICORE_AUTH_URL=${{ env.PUBLIC_TRICORE_AUTH_URL }}" >> .env
        echo "NODE_ENV=${{ env.NODE_ENV }}" >> .env
        make push

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_REGION }}

    - name: Deploy on GKE
      run: make deploy GKE_CLUSTER=${{ env.GKE_CLUSTER }}
