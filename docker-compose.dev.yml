services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - ../agent-worker/schema/execution.json:/app/agent-worker/schema/execution.json
      - ../agent-worker/.git:/app/agent-worker/.git
    environment:
      AGENT_WORKER_DIR: agent-worker
    ports:
      - 5173:5173
    depends_on:
      - proxy

  redis:
    image: redis:8-alpine
    # hide logs
    logging:
      driver: none

  # small container that forwards ports to the tricore cluster
  cluster-proxy:
    build:
      context: ./cluster-proxy
      dockerfile: Dockerfile
    # technically not strictly needed, but easier to debug
    ports:
      - 8081:8081
      - 8082:8082
    volumes:
      - ./cluster-proxy/tricore-cluster-svckey.json:/tricore-cluster-svckey.json
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tricore-cluster-svckey.json
      GKE_PROJECT_ID: triformcloud
      GKE_CLUSTER_NAME: stage
      GKE_REGION: europe-west3
    # mark as healthy only when the port forwards are established
    healthcheck:
      test: ['CMD', 'sh', '-c', 'curl http://localhost:8081 && curl http://localhost:8082']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 10s

  proxy:
    image: europe-docker.pkg.dev/triformcloud/k8s/proxy:v0.7.1-5c11703
    platform: linux/amd64
    ports:
      - 8080:8080
    environment:
      RUST_LOG: warn
      RUST_BACKTRACE: 1
      HMAC_SECRET: sunras-cihkyP-1wovky
      PORT: 8080
      AGENT_WORKER_SVC: cluster-proxy:8081
      TRIBUILDER_SVC: cluster-proxy:8082
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${PROXY_JWT_SECRET}
      DOMAIN: localhost
      DATABASE_URL: ${PROXY_DATABASE_URL}
      LOGIN_URL_OK: http://localhost:5173/dashboard
      LOGIN_URL_FAIL: http://localhost:5173/login
      # Discord
      DISCORD_CLIENT_ID: ${PROXY_DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${PROXY_DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URL: http://localhost:8080/v1/login/discord/redirect
      DISCORD_AUTH_URL: https://discord.com/api/oauth2/authorize
      DISCORD_TOKEN_URL: https://discord.com/api/oauth2/token
      DISCORD_SCOPES: identify,email,guilds
      # Github
      GITHUB_CLIENT_ID: ${PROXY_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${PROXY_GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: http://localhost:8080/v1/login/github/redirect
      GITHUB_AUTH_URL: https://github.com/login/oauth/authorize
      GITHUB_TOKEN_URL: https://github.com/login/oauth/access_token
      GITHUB_SCOPES: read:user,user:email
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      cluster-proxy:
        condition: service_healthy
      redis:
        condition: service_started
