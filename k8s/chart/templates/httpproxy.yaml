apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  routes:
  - conditions:
    - prefix: /
    services:
    - name: {{ .Release.Name }}
      port: {{ .Values.port }}
  virtualhost:
    fqdn: {{ .Values.httpproxy.fqdn }}
    tls:
      secretName: {{ .Values.httpproxy.tls.secretName }}
